{{- if and .Values.secret.create .Values.existingSecret }}
{{- fail "set either secret.create or existingSecret, not both" }}
{{- end }}
{{- if .Values.secret.create }}
# Quick start only. Create this Secret from your secret store instead, and set
# existingSecret. Never regenerate JWT_SECRET or SESSION_SECRET on upgrade: that
# invalidates every issued token.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corelink.secretName" . }}
  labels:
    {{- include "corelink.labels" . | nindent 4 }}
  {{- if .Values.migrate.hook }}
  annotations:
    {{- include "corelink.hookAnnotations" (dict "weight" "-10") | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.secret.databasePassword | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  SESSION_SECRET: {{ .Values.secret.sessionSecret | quote }}
{{- end }}
{{- if and .Values.database.sslRootCert.pem (not .Values.database.sslRootCert.secretName) }}
---
# CA bundle (PEM) that signed the PostgreSQL certificate, for verify-ca and
# verify-full.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corelink.dbCASecret" . }}
  labels:
    {{- include "corelink.labels" . | nindent 4 }}
  {{- if .Values.migrate.hook }}
  annotations:
    {{- include "corelink.hookAnnotations" (dict "weight" "-10") | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  ca.pem: |
    {{- .Values.database.sslRootCert.pem | trim | nindent 4 }}
{{- end }}
