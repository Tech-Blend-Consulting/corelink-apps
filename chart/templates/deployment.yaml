{{- if and .Values.license.existingSecret .Values.persistence.enabled }}
{{- fail "license.existingSecret supplies CORELINK_LICENSE and needs persistence.enabled=false: the server refuses to start with both the file and the content" }}
{{- end }}
{{- if include "corelink.scaled" . }}
{{- $rwx := has "ReadWriteMany" .Values.persistence.accessModes }}
{{- $cloudKMS := and (has .Values.kms.provider (list "aws" "azure" "gcp")) (not .Values.persistence.enabled) .Values.license.existingSecret }}
{{- if not (or $rwx $cloudKMS) }}
{{- fail "more than one replica (replicaCount > 1 or autoscaling.enabled) cannot share a ReadWriteOnce data volume or a local key file: either set persistence.accessModes to [ReadWriteMany] (also when persistence.existingClaim is a ReadWriteMany claim), or set kms.provider to aws, azure or gcp together with persistence.enabled=false and license.existingSecret" }}
{{- end }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- if not (dig "requests" "cpu" "" (.Values.resources | default dict)) }}
{{- fail "autoscaling.enabled needs resources.requests.cpu: the CPU target is a percentage of the request" }}
{{- end }}
{{- if lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas) }}
{{- fail "autoscaling.maxReplicas must be at least autoscaling.minReplicas" }}
{{- end }}
{{- end }}
# One replica keeps the KEK volume (ReadWriteOnce) simple. More replicas behind
# the Service (replicaCount > 1 or autoscaling.enabled) are safe (the scheduler
# lock lets one run the schedulers) but need a ReadWriteMany volume for
# /app/data, or a cloud KMS and a license that every replica can read; the
# chart refuses anything else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "corelink.fullname" . }}
  labels:
    {{- include "corelink.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- if .Values.strategy }}
    {{- toYaml .Values.strategy | nindent 4 }}
    {{- else if include "corelink.scaled" . }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "corelink.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      {{- if or .Values.rollOnConfigChange .Values.podAnnotations }}
      annotations:
        {{- if .Values.rollOnConfigChange }}
        checksum/config: {{ include "corelink.config" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "corelink.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with (include "corelink.serviceAccountName" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tbcl-server
          image: {{ include "corelink.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.autoscaling.requestsPerSecond.enabled }}
            - name: metrics
              containerPort: 9090
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "corelink.fullname" . }}-config
            - secretRef:
                name: {{ include "corelink.secretName" . }}
          {{- if or .Values.license.existingSecret .Values.extraEnv }}
          env:
            {{- if .Values.license.existingSecret }}
            - name: CORELINK_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.license.existingSecret }}
                  key: {{ .Values.license.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # /health is liveness, /ready is readiness; GET and HEAD both answer.
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            {{- if include "corelink.dbCASecret" . }}
            - name: db-ca
              mountPath: /app/certs
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "corelink.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if include "corelink.dbCASecret" . }}
        - name: db-ca
          secret:
            secretName: {{ include "corelink.dbCASecret" . }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (include "corelink.scaled" .) .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        {{- if .Values.topologySpread.constraints }}
        {{- toYaml .Values.topologySpread.constraints | nindent 8 }}
        {{- else }}
        {{- range $key := list "topology.kubernetes.io/zone" "kubernetes.io/hostname" }}
        - maxSkew: 1
          topologyKey: {{ $key }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "corelink.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: server
        {{- end }}
        {{- end }}
      {{- end }}
