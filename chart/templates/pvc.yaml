{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# /app/data holds the local KEK and the license file. Losing the KEK makes every
# stored secret unrecoverable: use a storage class that survives node loss, and
# back the volume up (or use a cloud KMS and keep only the license here).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "corelink.fullname" . }}-data
  labels:
    {{- include "corelink.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
