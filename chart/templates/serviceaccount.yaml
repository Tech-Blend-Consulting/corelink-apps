{{- if .Values.serviceAccount.create }}
# The identity the server pods run as. Put the cloud's workload-identity
# annotation in serviceAccount.annotations: eks.amazonaws.com/role-arn (EKS),
# azure.workload.identity/client-id (AKS; also label the pods with
# podLabels azure.workload.identity/use: "true"), or
# iam.gke.io/gcp-service-account (GKE).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "corelink.serviceAccountName" . }}
  labels:
    {{- include "corelink.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
