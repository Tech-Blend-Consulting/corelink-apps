# CoreLink self-hosted chart. Every value below is the documented default.
#
# Required for a working install (the defaults are placeholders):
#   config.publicUrl, config.trustedProxyCidrs, database.host, and a Secret
#   holding DATABASE_PASSWORD, JWT_SECRET and SESSION_SECRET (see existingSecret).

nameOverride: ""
fullnameOverride: ""

image:
  # Point this at your own mirror when you run from a private registry.
  repository: ghcr.io/tech-blend-consulting/corelink-server
  # Defaults to the chart's appVersion (the release the chart was packaged with).
  tag: ""
  # Optional sha256:... digest; when set it is used instead of the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1
# More than one replica (replicaCount > 1 or autoscaling.enabled) needs a
# ReadWriteMany data volume (persistence.accessModes), or a cloud KMS with
# persistence.enabled=false and license.existingSecret; the chart refuses
# anything else. See the README, "Scaling".
#
# Left empty, the update strategy is Recreate for one replica (the ReadWriteOnce
# volume must be released first) and RollingUpdate with maxUnavailable 0 and
# maxSurge 1 for several. Set it to override.
strategy: {}

# Horizontal Pod Autoscaler on CPU. While enabled, replicaCount is ignored and
# the Deployment leaves the replica count to the autoscaler. Needs
# resources.requests.cpu.
autoscaling:
  enabled: false
  minReplicas: 3
  # Set this to what your database connection budget allows:
  # maxReplicas x database.maxOpenConns.
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Also scale on requests per second per pod, as a Pods metric. Needs a
  # Prometheus adapter or KEDA on the cluster that serves metricName (a rate of
  # corelink_http_requests_total). Enabling it sets METRICS_BIND to
  # 0.0.0.0:9090 on the pods (unless config.extra.METRICS_BIND is set) and
  # declares a "metrics" container port; Prometheus must scrape that port.
  requestsPerSecond:
    enabled: false
    metricName: corelink_http_requests_per_second
    # Average requests per second per pod (a Kubernetes quantity, e.g. "50").
    targetPerPod: "50"
  # Optional autoscaling/v2 behavior (scaleUp, scaleDown policies).
  behavior: {}

# Allow one pod down at a time during node drains. Rendered only for more than
# one replica; a budget on a single pod would block every drain.
pdb:
  enabled: true
  maxUnavailable: 1

# Spread the pods over zones and nodes (rendered only for more than one
# replica). ScheduleAnyway keeps small and single-zone clusters schedulable.
# constraints replaces the default pair when set.
topologySpread:
  enabled: true
  constraints: []

# How long Kubernetes waits after SIGTERM before killing the pod. Live SSH and
# database sessions continue for SESSION_DRAIN_TIMEOUT (default 15 minutes, 900 s)
# once the pod is removed; keep this at that timeout plus 30 s.
terminationGracePeriodSeconds: 930

# ServiceAccount for the server pods. Create one to carry the workload-identity
# annotation a cloud KMS needs (eks.amazonaws.com/role-arn,
# azure.workload.identity/client-id, iam.gke.io/gcp-service-account), or name an
# existing one. Left as is, the pods use the namespace's default account.
serviceAccount:
  create: false
  # Defaults to the release's full name when create is true.
  name: ""
  annotations: {}

resources: {}
podAnnotations: {}
podLabels: {}
# Restart the pods when the configuration changes.
rollOnConfigChange: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

# /health is liveness, /ready is readiness; GET and HEAD both answer.
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 30

# Non-secret settings; each one is documented in ../../corelink.env.example.
config:
  environment: production
  logLevel: info
  # REQUIRED: the public URL your ingress serves.
  publicUrl: https://corelink.example.com
  # Defaults to publicUrl.
  corsAllowedOrigins: ""
  # REQUIRED: the pod CIDR or address range of your ingress controller.
  # Forwarded headers are trusted only from peers inside it.
  trustedProxyCidrs: 10.0.0.0/8
  # Any further environment variable from corelink.env.example, as KEY: value.
  extra: {}

# External PostgreSQL only: bring your own.
database:
  # REQUIRED
  host: postgres.example.internal
  port: 5432
  name: secrets_mgmt
  user: corelink
  # require, verify-ca or verify-full. "disable" is refused in production.
  sslmode: require
  # For verify-ca and verify-full: the CA bundle (PEM) that signed the server
  # certificate, either from an existing Secret (key ca.pem) or inline (a CA
  # certificate is public, so pem is safe as a plain value). Leave both empty
  # to verify against the container's system roots, or for sslmode require.
  sslRootCert:
    secretName: ""
    pem: ""
  maxOpenConns: 25
  maxIdleConns: 5
  connMaxLifetime: 5m

# Optional PgBouncer in front of PostgreSQL, in SESSION pool mode (the only mode
# safe for CoreLink's session-level advisory locks). It caps and queues
# connections; it does not multiplex. The pool defaults to replicaCount x
# database.maxOpenConns: lower database.maxOpenConns or set poolSize so that
# the total stays within the database's max_connections minus headroom for the
# migration Job and admin sessions (docs/admin-guide.md, "Database connections
# at many servers"). Needs a kubernetes.io/tls Secret for the client side.
pgbouncer:
  enabled: false
  image:
    repository: edoburu/pgbouncer
    tag: v1.25.2-p0
  # Server connections to PostgreSQL. 0 = replicaCount x database.maxOpenConns.
  poolSize: 0
  # Client connections accepted beyond the pool (migration Job, queued clients).
  clientHeadroom: 10
  # How PgBouncer authenticates to PostgreSQL and its clients (the image
  # defaults to md5, which a SCRAM-only database refuses).
  authType: scram-sha-256
  tls:
    secretName: ""
  resources: {}
  # Further container environment for the image, as name/value entries.
  extraEnv: []

# local keeps the KEK on the /app/data volume: back it up. Use aws, azure or
# gcp to keep the key off the disk. gcp takes kms.gcp.* below (KMS_GCP_* in
# config.extra or extraEnv also works); for aws and azure add the provider's
# variables to config.extra and its credentials to extraEnv.
kms:
  provider: local
  # provider: gcp uses Cloud KMS with the pod's own identity (Workload Identity):
  # annotate serviceAccount with the Google service account, which needs
  # roles/cloudkms.cryptoKeyEncrypterDecrypter on the key. No key file is read.
  gcp:
    project: ""
    location: ""
    keyRing: ""
    keyName: ""

# With persistence off and a cloud KMS, supply the license as content from a
# Secret: it becomes CORELINK_LICENSE.
license:
  existingSecret: ""
  key: license.json

# The name of an existing Secret holding DATABASE_PASSWORD, JWT_SECRET and
# SESSION_SECRET. Defaults to <release>-secrets. Create it yourself (or from
# your secret store) before installing; never regenerate JWT_SECRET or
# SESSION_SECRET on upgrade, that invalidates every issued token.
existingSecret: ""
# Quick starts only: have the chart create that Secret from these values. They
# end up in Helm's release history, so prefer existingSecret.
secret:
  create: false
  databasePassword: ""
  jwtSecret: ""
  sessionSecret: ""

# /app/data holds the local KEK and the license file. Losing the KEK makes every
# stored secret unrecoverable.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""
  # Keep the claim (and the KEK) when the release is uninstalled.
  keepOnUninstall: true

migrate:
  # Run the migration Job as a pre-install and pre-upgrade hook, so helm
  # upgrade migrates before the new pods start and a failed migration fails
  # the upgrade. false renders a plain Job (the kubernetes/ manifests).
  hook: true
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400

service:
  type: ClusterIP
  port: 80
  annotations: {}

# Example for the ingress-nginx controller; other controllers need their own
# WebSocket and timeout settings.
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
  hosts:
    - host: corelink.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Extra container environment (list of name/value or valueFrom entries).
extraEnv: []
