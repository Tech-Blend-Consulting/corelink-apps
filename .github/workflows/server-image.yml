# Publish the CoreLink server as a container image.
#
# A self-hosted install pulls ghcr.io/tech-blend-consulting/corelink-server. This
# builds from server/Dockerfile -- which downloads the published release tarball
# and verifies its checksum rather than compiling anything -- and pushes it to
# this repository's own package registry with the workflow's own token, so no
# machine of ours holds a registry login. The image carries the migration runner
# (/app/migrate), so there is no separate migrate image.
#
# Runs on a tag, or by hand for a release that was tagged before this existed.
name: server image

on:
  push:
    tags:
      - 'server/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'CoreLink release to package, e.g. 1.28.3'
        required: true

permissions:
  contents: read
  packages: write
  # Keyless cosign signs with the workflow's OIDC identity: no key to hold.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out which release to package
        id: release
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # refs/tags/server/v1.28.3 -> 1.28.3
            echo "version=${GITHUB_REF_NAME#server/v}" >> "$GITHUB_OUTPUT"
          fi

      # Published for linux/amd64 and linux/arm64: hosts run both.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.release.outputs.version }}
          push: true
          tags: |
            ghcr.io/tech-blend-consulting/corelink-server:${{ steps.release.outputs.version }}
            ghcr.io/tech-blend-consulting/corelink-server:latest

      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/tech-blend-consulting/corelink-server@${DIGEST}"
